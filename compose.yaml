services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: homebase
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - homebase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebase"]
      interval: 5s
      retries: 10
volumes:
  homebase-db:
